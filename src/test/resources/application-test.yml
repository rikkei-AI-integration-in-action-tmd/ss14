spring:
  application:
    name: smarthub-test
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:h2:mem:smarthubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
server:
  port: 0
management:
  tracing:
    sampling:
      probability: 0
